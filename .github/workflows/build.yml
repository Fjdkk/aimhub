name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app (no signing)
        run: |
          set -eo pipefail
          xcodebuild \
            -project AimHub.xcodeproj \
            -target AimHub \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$(pwd)/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build | xcbeautify || xcodebuild \
            -project AimHub.xcodeproj \
            -target AimHub \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$(pwd)/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          set -eo pipefail
          APP=$(find build -name "*.app" -maxdepth 3 | head -1)
          echo "APP=$APP"
          # Ensure iTunesArtwork and AppIcons exist for Telegram/AltStore/TrollStore thumbnail preview
          ICON_SRC="Sources/AimHub/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          if [ -f "$ICON_SRC" ]; then
            cp "$ICON_SRC" "$APP/AppIcon.png"
            cp "$ICON_SRC" "$APP/iTunesArtwork"
            cp "$ICON_SRC" "$APP/iTunesArtwork@2x"
            cp "$ICON_SRC" iTunesArtwork
            cp "$ICON_SRC" iTunesArtwork@2x
          fi
          rm -rf "$APP/_CodeSignature"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "AimHub_Cheat.ipa" Payload
          cp "AimHub_Cheat.ipa" AimHub.ipa
          ls -la AimHub_Cheat.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AimHub_Cheat
          path: AimHub_Cheat.ipa
          retention-days: 7