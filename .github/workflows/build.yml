name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app (no signing)
        run: |
          set -eo pipefail
          xcodebuild \
            -project AimHub.xcodeproj \
            -target AimHub \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build | xcbeautify || xcodebuild \
            -project AimHub.xcodeproj \
            -target AimHub \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          set -eo pipefail
          APP=$(find build/Build/Products -name "*.app" -maxdepth 2 | head -1)
          echo "APP=$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry AimHub.ipa Payload
          ls -la AimHub.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AimHub-unsigned
          path: AimHub.ipa
          retention-days: 7