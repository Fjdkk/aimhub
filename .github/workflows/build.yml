name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust target for iOS
        run: |
          set -eo pipefail
          rustup target add aarch64-apple-ios

      - name: Build Rust FFI Core (Apple RemotePairing engine)
        run: |
          set -eo pipefail
          cd Rust
          cargo build --release --target aarch64-apple-ios
          ls -la target/aarch64-apple-ios/release/libstikpair_ffi.a
          cd ..

      - name: Build app (no signing)
        run: |
          set -eo pipefail
          RUST_LIB_DIR="$(pwd)/Rust/target/aarch64-apple-ios/release"
          xcodebuild \
            -project AimHub.xcodeproj \
            -target AimHub \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$(pwd)/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            OTHER_LDFLAGS="\$(inherited) -L${RUST_LIB_DIR} -lstikpair_ffi -framework Security -framework SystemConfiguration -framework Network" \
            LIBRARY_SEARCH_PATHS="\$(inherited) ${RUST_LIB_DIR}" \
            build | xcbeautify || xcodebuild \
            -project AimHub.xcodeproj \
            -target AimHub \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$(pwd)/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            OTHER_LDFLAGS="\$(inherited) -L${RUST_LIB_DIR} -lstikpair_ffi -framework Security -framework SystemConfiguration -framework Network" \
            LIBRARY_SEARCH_PATHS="\$(inherited) ${RUST_LIB_DIR}" \
            build

      - name: Package IPA
        run: |
          set -eo pipefail
          APP=$(find build -name "*.app" -maxdepth 3 | head -1)
          echo "APP=$APP"
          # Ensure iTunesArtwork and AppIcons exist for Telegram/AltStore/TrollStore thumbnail preview
          ICON_SRC="Sources/AimHub/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          if [ -f "$ICON_SRC" ]; then
            cp "$ICON_SRC" "$APP/AppIcon.png"
            cp "$ICON_SRC" "$APP/iTunesArtwork"
            cp "$ICON_SRC" "$APP/iTunesArtwork@2x"
            cp "$ICON_SRC" iTunesArtwork
            cp "$ICON_SRC" iTunesArtwork@2x
          fi
          codesign -s - --entitlements Sources/AimHub/AimHub.entitlements --force "$APP" || true
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "AimHub Cheat V2.6.5.ipa" Payload iTunesArtwork iTunesArtwork@2x
          cp "AimHub Cheat V2.6.5.ipa" AimHub_Cheat.ipa
          cp "AimHub Cheat V2.6.5.ipa" AimHub.ipa
          ls -la "AimHub Cheat V2.6.5.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AimHub Cheat V2.6.5
          path: "AimHub Cheat V2.6.5.ipa"
          retention-days: 7
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AimHub Cheat V2.6.5.ipa
          name: AimHub Cheat V2.6.5
          body: |
            ### AimHub Cheat V2.6.5 Hoàn Chỉnh
            - Tích hợp AntiBan V2 Guard Check: Cảnh báo và bắt buộc dọn dẹp an toàn trước khi kích hoạt mod.
            - Giao diện Status AntiBan V2 độc lập với Terminal Log chi tiết.
            - Xóa sạch 100% telemetry và các file nhật ký theo dõi của game.
            - Cấu hình NextDNS Profile 62aaee (RIN STORE VIP SHIELD) với 347 domain chặn toàn diện.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
